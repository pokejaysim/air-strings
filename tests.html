<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air Strings tests</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; background: #0b0d12; color: #e8ecf3; margin: 0; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    #summary { font-weight: 700; margin-bottom: 16px; }
    ul { list-style: none; padding: 0; margin: 0; }

    code { color: #ffcf6b; }
    a { color: #8fb4ff; }
  </style>

  <h1>Air Strings — pitch math tests</h1>
  <div id="summary">Running…</div>
